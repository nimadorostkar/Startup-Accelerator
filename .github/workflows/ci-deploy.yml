# Fundup Club: test every push and pull request; deploy main to production.
#
# Deploying needs three repository secrets (Settings → Secrets and variables → Actions),
# see docs/deployment.md → "Continuous deployment":
#   DEPLOY_HOST         the server's address
#   DEPLOY_SSH_KEY      private key of the deploy key installed on the server (root, limited
#                       to deploys by its forced command: deploy/ci-ssh.sh)
#   DEPLOY_KNOWN_HOSTS  the server's SSH host key line(s), so the connection can't be intercepted
# The site's own secrets live only in the server's /opt/fundup/.env.

name: CI and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fundup
          POSTGRES_PASSWORD: fundup
          POSTGRES_DB: fundup
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fundup" --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://fundup:fundup@localhost:5432/fundup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Migrations are complete
        run: DJANGO_SECRET_KEY=ci python manage.py makemigrations --check --dry-run
      - name: Tests
        run: pytest --create-db

  website:
    name: Website checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Types
        # PageProps, LayoutProps and route types are generated by Next, not checked in.
        run: npx next typegen && npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://fundupclub.com
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    name: Deploy to production
    needs: [api, website]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://fundupclub.com
    # One deploy at a time; a newer push waits for the running one instead of cancelling it.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          for name in DEPLOY_HOST DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [ -z "$(printenv "$name")" ]; then
              echo "::error::The $name repository secret isn't set (docs/deployment.md → Continuous deployment)."
              exit 1
            fi
          done
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # The key's forced command on the server (deploy/ci-ssh.sh) only accepts this.
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "root@$DEPLOY_HOST" "deploy ${{ github.sha }}"
      - name: Check the live site
        run: |
          curl -fsS --retry 5 --retry-delay 5 https://fundupclub.com/api/v1/health/ready
          curl -fsS --retry 5 --retry-delay 5 -o /dev/null https://fundupclub.com/
