<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title>Fundup Club</title>
</head>
<body style="margin:0;padding:0;background:#f6f2ec;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#141210;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f2ec;padding:32px 16px;">
<tr><td align="center">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:16px;overflow:hidden;">
    <tr><td style="background:#141210;padding:20px 28px;">
      <a href="{{ site_url }}" style="color:#ffffff;text-decoration:none;font-weight:700;font-size:18px;letter-spacing:-0.01em;">fundup <span style="color:#ef6f23;">club</span></a>
    </td></tr>
    <tr><td style="padding:28px;font-size:15px;line-height:1.6;color:#2b2622;">
      {{ body|urlize|linebreaks }}
      {% if action_url and action_label %}
      <p style="margin:28px 0 8px;">
        <a href="{{ action_url }}" style="display:inline-block;background:#ef6f23;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:999px;">{{ action_label }}</a>
      </p>
      {% endif %}
    </td></tr>
    <tr><td style="padding:18px 28px;border-top:1px solid #efe8df;font-size:12px;line-height:1.5;color:#8a8079;">
      Fundup Club · <a href="{{ site_url }}" style="color:#8a8079;">{{ site_url }}</a>{% if unsubscribe_url %} · <a href="{{ unsubscribe_url }}" style="color:#8a8079;">Unsubscribe</a>{% endif %}
    </td></tr>
  </table>
</td></tr>
</table>
</body>
</html>
